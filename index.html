<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags (For Google & AI Search Engines) -->
    <title>PujoPath | পুজোপাথ - Old Kolkata Durga Puja Tour Guide</title>
    <meta name="title" content="PujoPath | পুজোপাথ - Old Kolkata Durga Puja Tour Guide">
    <meta name="description" content="Explore the best of Old Kolkata's Durga Puja with PujoPath. A complete step-by-step interactive route map from Shyambazar to Shobhabazar for the ultimate pandal hopping experience.">
    <meta name="keywords" content="Durga Puja tour for old Kolkata, North Kolkata pandal hopping, Shyambazar to Shobhabazar puja map, PujoPath, পুজোপাথ, Kolkata Durga Puja guide 2026, best pujas in north kolkata, AI pujo guide">
    <meta name="author" content="Dipun Chakraborty">
    
    <!-- Open Graph / Facebook / WhatsApp (For Rich Link Previews) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cellflow24.github.io/PujoPath/">
    <meta property="og:title" content="PujoPath | পুজোপাথ - Old Kolkata Durga Puja Tour Guide">
    <meta property="og:description" content="আপনার পকেট গাইড! শ্যামবাজার থেকে শোভাবাজার - উত্তর কলকাতার সেরা পুজো মণ্ডপগুলোর রুটম্যাপ।">
    <meta property="og:image" content="puja.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="PujoPath | পুজোপাথ - North Kolkata Pujo Route">
    <meta property="twitter:description" content="Explore the best of Old Kolkata's Durga Puja with our step-by-step route map.">
    <meta property="twitter:image" content="puja.png">

    <!-- Favicon & Fonts -->
    <link rel="icon" type="image/png" href="puja.png">
    <link href="https://fonts.googleapis.com/css2?family=Galada&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- AOS CSS for Animations -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- Screen 1: Home / Start Screen -->
        <div id="home-screen" class="screen active">
            <div class="header bounce-in">
                <img src="puja.png" alt="PujoPath Logo" class="logo">
                <h1>পুজোপাথ</h1>
                <p>শ্যামবাজার থেকে শোভাবাজার - সেরা পুজোর রুটম্যাপ!</p>
            </div>
            
            <div class="selection-box fade-in-up">
                <h3>কোথা থেকে যাত্রা শুরু করবেন?</h3>
                <button class="btn primary-btn" onclick="showList('shyambazar')">শ্যামবাজার থেকে</button>
                <button class="btn secondary-btn" onclick="showList('shobhabazar')">শোভাবাজার থেকে</button>
            </div>
        </div>

        <!-- Screen 2: List Screen (New) -->
        <div id="list-screen" class="screen">
            <div class="header">
                <h2>পুজোর সম্পূর্ণ তালিকা</h2>
            </div>
            <div id="pandal-list-container" class="list-container">
                <!-- List will be generated via JS -->
            </div>
            <div class="start-btn-container fade-in-up">
                <button class="btn action-btn pulse-anim" onclick="beginJourneyFlow()">যাত্রা শুরু করুন 🚀</button>
            </div>
        </div>

        <!-- Screen 3: Journey Tracking Screen -->
        <div id="journey-screen" class="screen">
            <div class="top-bar slide-down">
                <h2 id="current-stop-number">স্টপ ১/১৩</h2>
                <button class="btn restart-btn" onclick="confirmRestart()">রিসেট করুন</button>
            </div>

            <div class="card-container">
                <div class="pandal-card scale-in" id="pandal-card-anim">
                    <h2 id="pandal-name">প্যান্ডেলের নাম</h2>
                    
                    <a id="pandal-map-link" href="#" target="_blank" class="btn map-btn hover-pop">
                        ম্যাপ দেখুন 📍
                    </a>

                    <div class="action-area">
                        <button class="btn check-btn hover-pop" onclick="markAsVisited()">
                            দর্শন সম্পন্ন ✔
                        </button>
                    </div>
                </div>
            </div>
            <div class="progress-text fade-in-up">
                <p id="progress-info">পরবর্তী গন্তব্য নিচে আপডেট হবে...</p>
            </div>
        </div>

        <!-- Screen 4: Journey Complete Screen -->
        <div id="complete-screen" class="screen">
            <div class="header bounce-in">
                <h1>শুভ মহাষ্টমী!</h1>
                <p>আমাদের মহাষ্টমীর পুজো পরিক্রমা সফলভাবে সম্পন্ন হয়েছে।</p>
            </div>
            <!-- আপনার 9:16 ছবির জন্য এই ক্লাস এবং ইমেজ যুক্ত থাকবে -->
            <img src="bondhura.jpg" alt="Friends Group Photo" class="group-photo portrait scale-in">
            <button class="btn primary-btn mt-20 hover-pop" onclick="confirmRestart()">নতুন করে শুরু করুন</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
